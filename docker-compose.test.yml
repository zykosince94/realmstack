# Runs vet, unit tests and PostgreSQL integration tests in containers.
#   docker compose -f docker-compose.test.yml run --rm test
# The database lives in tmpfs and disappears when the containers stop.
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realmstack_test
      POSTGRES_PASSWORD: realmstack_test
      POSTGRES_DB: realmstack_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmstack_test -d realmstack_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional rank projection (spec 6.6): tests that need it read TEST_REDIS_URL.
  test-redis:
    image: redis:8.8.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    environment:
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://realmstack_test:realmstack_test@test-db:5432/realmstack_test?sslmode=disable
      TEST_REDIS_URL: redis://test-redis:6379/0
    command: >
      sh -c "if [ -n \"$$(gofmt -l .)\" ]; then echo 'gofmt needed:'; gofmt -l .; exit 1; fi;
             go vet ./... &&
             go test -count=1 -coverpkg=./internal/... -coverprofile=/tmp/coverage.out ./... &&
             go tool cover -func=/tmp/coverage.out | tail -1"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy

volumes:
  go-mod-cache:
