name: Feature request
description: Suggest a capability or a change to existing behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the game or operational problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the API to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
