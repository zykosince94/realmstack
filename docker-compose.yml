# Standalone backend demo: database and API only (no dashboard).
#
#   docker compose up -d --build --wait
#   docker compose down                     # stop, keep the database
#
# The full stack with the dashboard lives in ../realmstack-frontend (project
# `realmstack`); both publish host port 8080, so run one at a time. Credentials below
# are LOCAL DEMO values: never reuse them anywhere real. Ports are bound to 127.0.0.1.
#
# Containers are named realmstack-backend-<service>-1, the image realmstack-api:local
# (shared with the full stack) and the volume realmstack-backend_db-data.
name: realmstack-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realmstack
      POSTGRES_PASSWORD: realmstack
      POSTGRES_DB: realmstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmstack -d realmstack"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    image: realmstack-api:local
    restart: unless-stopped
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://realmstack:realmstack@db:5432/realmstack?sslmode=disable
      JWT_SECRET: local-only-change-me-before-deploy-please
      DEMO_MODE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
