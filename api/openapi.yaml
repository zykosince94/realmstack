        - claimed
    PlayerQuest:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        chain:
          type: string
          nullable: true
        repeat:
          type: string
          enum:
            - none
            - daily
            - weekly
        auto_accept:
          type: boolean
        claimable_by:
          type: string
          enum:
            - player
            - server
        requires_quests:
          type: array
          items:
            type: string
        requires_achievements:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - claimed
            - locked
            - upcoming
            - expired
            - completed
            - active
            - available
        period_key:
          type: string
          description: "Empty for non-repeating quests, YYYY-MM-DD (UTC) for daily, YYYY-Www for weekly."
        accepted_at:
          type: string
          format: date-time
          nullable: true
          description: "When progress started counting (for auto-accepted quests, when the quest became available)."
        auto_accepted:
          type: boolean
        current_stage:
          type: integer
          nullable: true
          description: "Index of the first incomplete stage; null when complete or not accepted."
        stages:
          type: array
          items:
            "$ref": "#/components/schemas/PlayerQuestStage"
        rewards:
          "$ref": "#/components/schemas/Rewards"
        completion_claimed:
          type: boolean
        claimable:
          type: object
          properties:
            stages:
              type: array
              items:
                type: integer
            completion:
              type: boolean
          required:
            - stages
            - completion
        locked_by:
          type: object
          properties:
            quests:
              type: array
              items:
                type: string
            achievements:
              type: array
              items:
                type: string
          required:
            - quests
            - achievements
        available_from:
          type: string
          format: date-time
          nullable: true
        available_until:
          type: string
          format: date-time
          nullable: true
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: "End of the current period for daily and weekly quests."
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: "When the availability window closes."
      required:
        - key
        - name
        - description
        - chain
        - repeat
        - auto_accept
        - claimable_by
        - requires_quests
        - requires_achievements
        - status
        - period_key
        - accepted_at
        - auto_accepted
        - current_stage
        - stages
        - rewards
        - completion_claimed
        - claimable
        - locked_by
        - available_from
        - available_until
        - resets_at
        - expires_at
