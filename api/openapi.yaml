components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description: "Dashboard user access token."
    playerBearer:
      type: http
      scheme: bearer
      description: "Player access token."
    serverCredential:
      type: apiKey
      in: header
      name: X-Server-Credential
      description: "Trusted game-server credential (prefix.secret). Never ship it in a client."
    publicEnvironment:
      type: apiKey
      in: header
      name: X-Public-Environment
      description: "Public environment identifier. Selects scope; it is not a secret."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Identifies one logical operation; reuse it only when retrying that operation."
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    E400:
      description: "Malformed request or missing Idempotency-Key."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E401:
      description: "Missing or invalid authentication."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E403:
      description: "Not permitted."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E404:
      description: "Not found in the caller's scope."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E409:
      description: "Idempotency key reused with a different request, or conflicting state."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E422:
      description: "Business rule failed; validation errors carry details.errors."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E429:
      description: "Rate limited."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    QuestStage:
      type: object
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        name:
          type: string
        conditions:
          type: array
          items:
            "$ref": "#/components/schemas/Condition"
          minItems: 1
          maxItems: 5
        rewards:
          "$ref": "#/components/schemas/Rewards"
      required:
        - key
        - name
        - conditions
    QuestDefinition:
      type: object
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        name:
          type: string
        description:
          type: string
        chain:
          type: string
          description: "Optional grouping label, e.g. Main Story."
        requires_quests:
          type: array
          items:
            type: string
          nullable: true
        requires_achievements:
          type: array
          items:
            type: string
          nullable: true
        stages:
          type: array
          items:
            "$ref": "#/components/schemas/QuestStage"
          minItems: 1
          maxItems: 20
        rewards:
          "$ref": "#/components/schemas/Rewards"
        claimable_by:
          type: string
          enum:
            - player
            - server
          default: player
        auto_accept:
          type: boolean
        repeat:
          type: string
          enum:
            - none
            - daily
            - weekly
          default: none
        available_from:
          type: string
          format: date-time
          nullable: true
        available_until:
          type: string
          format: date-time
          nullable: true
      required:
        - key
        - name
        - stages
    PlayerQuestStage:
      type: object
      properties:
        key:
