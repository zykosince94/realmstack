          type: integer
          format: int64
        target:
          type: integer
          format: int64
        met:
          type: boolean
        has_value:
          type: boolean
          description: "False for a leaderboard_score condition with no score yet."
      required:
        - type
        - current
        - target
        - met
        - has_value
    PlayerAchievement:
      type: object
      properties:
        key:
          type: string
        hidden:
          type: boolean
        status:
          type: string
          enum:
            - in_progress
            - completed
            - claimed
        claimable_by:
          type: string
          enum:
            - player
            - server
        claimed_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            "$ref": "#/components/schemas/Condition"
          nullable: true
        rewards:
          allOf:
            - "$ref": "#/components/schemas/Rewards"
          nullable: true
        progress:
          type: array
          items:
            "$ref": "#/components/schemas/ConditionProgress"
          nullable: true
      required:
        - key
        - hidden
        - status
        - claimable_by
        - claimed_at
        - name
        - description
        - conditions
        - rewards
        - progress
      description: "For players, a hidden achievement that is still in progress has name, description, conditions, rewards and progress set to null."
    ClaimResult:
      type: object
      properties:
        key:
          type: string
        status:
          type: string
          enum:
            - claimed
        claimed_by:
          type: string
          enum:
            - player
            - server
        claimed_at:
          type: string
          format: date-time
        rewards:
          "$ref": "#/components/schemas/Rewards"
      required:
        - key
        - status
        - claimed_by
        - claimed_at
        - rewards
    AchievementStat:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        hidden:
          type: boolean
        claims:
          type: integer
          format: int64
        claimed_by_player:
          type: integer
          format: int64
        claimed_by_server:
          type: integer
          format: int64
      required:
        - key
        - name
        - hidden
        - claims
        - claimed_by_player
        - claimed_by_server
