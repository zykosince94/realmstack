# RealmStack API contract (OpenAPI 3.0). Hand-maintained: update it with every route change.
# TestOpenAPICoversEveryRoute fails when routes and this file disagree; the frontend
# generates src/api/generated/schema.ts from it (npm run generate:api).
openapi: "3.0.3"
info:
  title: "RealmStack API"
  version: "0.6.0"
  description: "Multi-tenant game backend. Every response uses {data, meta}; every error uses {error:{code,message,details}, meta}. Mutations require an Idempotency-Key: a replay returns the stored result and status, a different request with the same key returns 409. This document is the API contract: the frontend generates its client from it, and a backend test fails if a route is missing here."
servers:
  - url: "http://localhost:8080"
tags:
  - name: platform
  - name: dashboard
  - name: projects
  - name: configuration
  - name: players
  - name: inventory
  - name: economy
  - name: progression
  - name: leaderboards
  - name: stats
  - name: achievements
  - name: quests
paths:
  "/healthz":
    get:
      operationId: getHealthz
      tags:
        - platform
      summary: "Liveness check."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Health"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
  "/v1/auth/register":
    post:
      operationId: postAuthRegister
      tags:
        - dashboard
      summary: "Create a dashboard user (rate limited)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "400":
          "$ref": "#/components/responses/E400"
        "409":
          "$ref": "#/components/responses/E409"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
  "/v1/auth/login":
