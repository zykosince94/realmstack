# Load-test environment for the spec 6.6 target profile (see loadtest/README.md).
# Its own project name and database volume: it never touches the local demo stack.
#
#   docker compose up -d --build db pgbouncer1 pgbouncer2 pgbouncer3 redis api1 api2 api3
#   docker compose run --rm seed          # 500,000 players (once per database)
#   docker compose run --rm k6            # SCALE=1 DURATION=5m by default
#   docker compose run --rm verify        # rebuild check on the data the test wrote
name: realmstack-load

x-api: &api
  build:
    context: ..
  environment: &api-env
    # Requests go through PgBouncer in transaction mode with pgx's default cached
    # prepared statements: PgBouncer 1.21+ tracks them per server connection
    # (max_prepared_statements below). exec/simple_protocol modes break JSON arguments;
    # see cmd/api/main.go. Each API service overrides the host with its own PgBouncer.
    DATABASE_URL: postgres://realmstack:loadtest@pgbouncer1:5432/realmstack?sslmode=disable&pool_max_conns=120&pool_min_conns=20
    # Migrations (session advisory lock) and maintenance connect directly.
    DATABASE_DIRECT_URL: postgres://realmstack:loadtest@db:5432/realmstack?sslmode=disable&pool_max_conns=4
    JWT_SECRET: load-test-only-secret-load-test-only-secret
    APP_ENV: production
    BCRYPT_COST: "10"
    # One k6 container is one client IP; real login surges come from many IPs.
    AUTH_RATE_LIMIT_PER_MINUTE: "100000000"
    ACCESS_TOKEN_TTL: 1h
    # Rank projection (spec 6.6): player ranks from a Redis sorted set.
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

# One PgBouncer per API instance (the sidecar layout). PgBouncer is single-threaded, so
# one shared instance caps throughput at one core however much CPU the APIs and
# PostgreSQL have left; pairs scale with the number of API instances.
x-pgbouncer: &pgbouncer
  image: edoburu/pgbouncer:v1.26.0-p0
  environment:
    DATABASE_URL: postgres://realmstack:loadtest@db:5432/realmstack
    AUTH_TYPE: scram-sha-256
    POOL_MODE: transaction
    MAX_CLIENT_CONN: "1000"
    # Three bouncers x 80 server connections stays under max_connections=300.
    DEFAULT_POOL_SIZE: "60"
    MAX_DB_CONNECTIONS: "80"
    # Above the number of distinct statements the API prepares, so none are evicted.
    MAX_PREPARED_STATEMENTS: "1000"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realmstack
      POSTGRES_USER: realmstack
      POSTGRES_PASSWORD: loadtest
    command: [postgres, -c, max_connections=300, -c, shared_buffers=1GB, -c, effective_cache_size=4GB,
      -c, work_mem=16MB, -c, maintenance_work_mem=512MB, -c, max_wal_size=8GB, -c, checkpoint_timeout=15min,
      -c, wal_compression=lz4, -c, random_page_cost=1.1, -c, effective_io_concurrency=200,
      -c, max_worker_processes=16, -c, max_parallel_workers=8,
      # Per-statement timings for finding bottlenecks (see README: Profiling).
      -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=top]
    shm_size: 1gb
    volumes:
      - load-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmstack -d realmstack"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer1:
    <<: *pgbouncer
  pgbouncer2:
    <<: *pgbouncer
  pgbouncer3:
    <<: *pgbouncer

  # No persistence: a restarted Redis is empty and the API replays it from PostgreSQL.
  redis:
    image: redis:8.8.3-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api1:
    <<: *api
  api2:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgres://realmstack:loadtest@pgbouncer2:5432/realmstack?sslmode=disable&pool_max_conns=120&pool_min_conns=20
  api3:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgres://realmstack:loadtest@pgbouncer3:5432/realmstack?sslmode=disable&pool_max_conns=120&pool_min_conns=20

  seed:
    <<: *api
    profiles: [tools]
    restart: "no"
    entrypoint: ["./realmstack-admin", "seed-load", "-players", "${PLAYERS:-500000}", "-out", "/out/tenant.json"]
    volumes:
      - ./data:/out
    user: "0:0"

  verify:
    <<: *api
    profiles: [tools]
    restart: "no"
    entrypoint: ["./realmstack-admin", "verify"]

  k6:
    image: grafana/k6:1.8.2
    profiles: [tools]
    environment:
      SCALE: ${SCALE:-1}
      DURATION: ${DURATION:-5m}
      LOGIN_DURATION: ${LOGIN_DURATION:-2m}
      SCENARIOS: ${SCENARIOS:-}
      BASE_URLS: ${BASE_URLS:-http://api1:8080,http://api2:8080,http://api3:8080}
    volumes:
      - ./:/scripts
    user: "0:0"
    command: ["run", "--summary-export=/scripts/results/summary.json", "/scripts/realmstack.js"]
    depends_on: [api1, api2, api3]

volumes:
  load-db:
